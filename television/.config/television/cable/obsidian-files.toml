[metadata]
name = "obsidian-files"
description = "Browse Obsidian vault notes (sorted by recency)"
requirements = ["obsidian"]

[source]
command = "cd \"$DEFAULT_OBSIDIAN_VAULT_PATH\" && find . -name '*.md' -printf '%T@\\t%P\\n' | sort -rn | cut -f2-"
display = "{split:/:-1}"
no_sort = true
frecency = false

[preview]
command = "cd \"$DEFAULT_OBSIDIAN_VAULT_PATH\" && bat --style=plain --color=always '{}' 2>/dev/null || cat '{}'"

[ui]
layout = "portrait"

[ui.preview_panel]
size = 50

[keybindings]
enter = "actions:open"
ctrl-o = "actions:outline"

[actions.open]
description = "Open note in Obsidian"
command = '''F='{}'; F="${F%.md}"; F="${F// /%20}"; V="${DEFAULT_OBSIDIAN_VAULT// /%20}"; obsidian "obsidian://open?vault=$V&file=$F" 2>/dev/null'''
mode = "fork"

[actions.outline]
description = "Show note headings"
command = "cd \"$DEFAULT_OBSIDIAN_VAULT_PATH\" && obsidian outline path='{}' 2>/dev/null"
mode = "fork"
