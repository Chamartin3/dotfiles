[metadata]
name = "browser-bookmarks"
description = "Browse and open bookmarks for the current browser profile"
requirements = ["browser-manager"]

[source]
command = "browser-manager bookmarks"
ansi = true
output = "{strip_ansi|split:\t:2}"

[preview]
command = "browser-manager bookmark-info '{strip_ansi|split:\t:2}'"

[ui]
layout = "portrait"

[keybindings]
enter = "actions:open"

[actions.open]
description = "Open bookmark in browser (current profile)"
command = "browser-manager open '{strip_ansi|split:\t:2}'"
mode = "execute"
